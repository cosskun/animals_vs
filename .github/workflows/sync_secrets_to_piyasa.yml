name: Sync Secrets to Piyasa
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Secret Sync
        env:
          KEY_VAL: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          PAT_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npm install tweetsodium
          node -e "
          const sodium = require('tweetsodium');
          const token = process.env.PAT_TOKEN;
          const owner = 'cosskun';
          const repo = 'piyasa';
          const secretValue = process.env.KEY_VAL;

          async function setSec() {
            const pkRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/secrets/public-key', {
              headers: { 'Authorization': 'token ' + token, 'User-Agent': 'NodeJS', 'Accept': 'application/vnd.github.v3+json' }
            });
            const { key, key_id } = await pkRes.json();
            const messageBytes = Buffer.from(secretValue);
            const keyBytes = Buffer.from(key, 'base64');
            const encryptedBytes = sodium.seal(messageBytes, keyBytes);
            const encrypted = Buffer.from(encryptedBytes).toString('base64');

            const putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/secrets/APP_STORE_CONNECT_PRIVATE_KEY', {
              method: 'PUT',
              headers: {
                'Authorization': 'token ' + token,
                'User-Agent': 'NodeJS',
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ encrypted_value: encrypted, key_id: key_id })
            });
            console.log('Secret set result status:', putRes.status);
          }
          setSec().catch(console.error);
          "
