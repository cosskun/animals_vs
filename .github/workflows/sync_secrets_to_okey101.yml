name: Sync Secrets to Okey101

on:
  workflow_dispatch:
    inputs:
      pat_b64:
        description: 'Base64 PAT'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Secrets to anka_101_okey
        env:
          PAT_B64: ${{ inputs.pat_b64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          export GH_TOKEN=$(echo "$PAT_B64" | base64 -d)
          printf '%s' "$APP_STORE_CONNECT_KEY_ID" | gh secret set APP_STORE_CONNECT_KEY_ID --repo cosskun/anka_101_okey
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | gh secret set APP_STORE_CONNECT_ISSUER_ID --repo cosskun/anka_101_okey
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | gh secret set APP_STORE_CONNECT_PRIVATE_KEY --repo cosskun/anka_101_okey
          echo "All 3 secrets synced to cosskun/anka_101_okey!"
